# Netlify builds the Vite app and serves the `dist` folder as the site root.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Any unknown path falls back to the home page instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Book images never change name, so let browsers cache them for a while.
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vite fingerprints these files, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
