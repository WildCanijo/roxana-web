<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roxana Fadanelli — Art Director & UI/UX</title>

  <body>
    <!-- Netlify finds forms when it reads the built HTML; this hidden copy
         registers the contact form that React renders. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
